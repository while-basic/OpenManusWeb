[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Log settings
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Make sure asyncio works properly
asyncio_mode = auto

# Add a configuration to suppress the PytestCollectionWarning about __init__ constructor for our test tool classes
filterwarnings =
    ignore::pytest.PytestCollectionWarning:tests/test_agent_integration.py:13
    ignore::pytest.PytestCollectionWarning:tests/test_agents.py:11
    ignore::pytest.PytestCollectionWarning:tests/test_agents.py:20
    ignore::pytest.PytestCollectionWarning:tests/test_workflow.py:11
    ignore::pytest.PytestCollectionWarning:tests/test_workflow.py:31
    ignore::DeprecationWarning:app.tool.base
    ignore::pydantic.PydanticDeprecatedSince20
